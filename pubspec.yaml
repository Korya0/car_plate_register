# ----------
# Project Info
# ----------
name: car_register
description: "Car Register — record and manage car brochure numbers, offline-first."
publish_to: 'none'
version: 1.0.0+1

# ----------
# Environment
# ----------
environment:
  sdk: ^3.13.3

# ----------
# Dependencies
# ----------
dependencies:
  flutter:
    sdk: flutter

  # Localization
  flutter_localizations:
    sdk: flutter

  # State Management & Navigation
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.1

  # Local Database
  drift: ^2.35.3
  drift_flutter: ^0.3.1

  # Local Storage & Security
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^11.2.0
  local_auth: ^3.0.2

  # Firebase & Cloud
  firebase_core: ^5.1.0
  cloud_firestore: ^7.1.0

  # Connectivity & Date Formatting
  connectivity_plus: ^7.3.2
  intl: ^0.20.3

  # UI
  flutter_animate: ^4.5.2
  skeletonizer: ^3.0.0

# ----------
# Dev Dependencies
# ----------
dev_dependencies:
  flutter_test:
    sdk: flutter

  # Linting
  flutter_lints: ^6.0.0

  # Code Generation
  drift_dev: ^2.35.2
  build_runner: ^2.17.1  # dart run build_runner build --delete-conflicting-outputs

  # Testing
  mocktail: ^1.0.5

  # App Icon & Native Splash
  flutter_launcher_icons: ^0.14.4  # dart run flutter_launcher_icons
  flutter_native_splash: ^2.4.8  # dart run flutter_native_splash:create

# ----------
# Flutter
# ----------
flutter:
  uses-material-design: true

  # Assets
  assets:
    - assets/native/app_icon.png
    - assets/native/splash_logo.png

# ----------
# Launcher Icon (Android only)
# ----------
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/native/app_icon.png"
  min_sdk_android: 21

# ----------
# Native Splash (Android only)
# ----------
flutter_native_splash:
  color: "#050D14"
  image: assets/native/splash_logo.png
  android: true
  ios: false
  web: false
  android_12:
    color: "#050D14"
    image: assets/native/splash_logo.png
